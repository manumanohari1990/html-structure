<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comments in HTML</title>
</head>
<body>
    <h1>Comments in HTML</h1>
    <p>Comments are used to add notes or explanations within the HTML code. They are not displayed on the webpage.</p>

    <!-- This is Comment for single line and multi-line -->
     <!-- Comments can't be seen in website UI -->
  
    <h2>Example of Comments</h2>
    <p>Here is an example of how comments can be used in an HTML document:</p>
    <pre><code>&lt;!-- This is a comment explaining the heading below --&gt;</code></pre>
</body>
</html>
